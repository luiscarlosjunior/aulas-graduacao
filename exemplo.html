<!DOCTYPE html>
<html>
<head>
  <title>Aula Inaugural</title>
</head>
<body>
  <h1>Exemplo de texto</h1>
  <button onclick="mudarTexto()">Clique aqui</button>

  <script>
    function mudarTexto() {
      document.querySelector("h1").innerText = "Agora eu sou outro texto";
    }
  </script>
</body>
</html>
